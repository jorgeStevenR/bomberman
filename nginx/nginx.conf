# Nginx = nuestro "Application Load Balancer" + "CloudFront/S3" en local.
#  - Sirve el frontend estático (HTML/JS/imágenes).
#  - Reparte el WebSocket del juego entre 3 game-servers.
#  - Reparte la API REST entre 2 instancias de Node.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;            # no mostrar la versión de Nginx (seguridad)

    # ---------- Logs de acceso en JSON (los recoge Promtail → Loki) ----------
    # "upstream" dice QUÉ instancia atendió la petición: con esto el dashboard
    # de Grafana muestra el reparto de carga entre réplicas.
    log_format json escape=json '{'
        '"@timestamp":"$time_iso8601",'
        '"level":"$log_level",'
        '"service":"nginx",'
        '"message":"$request_method $uri $status",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"room":"$arg_room",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_name":"$upstream_name",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # Nombre legible de la instancia que respondió (para el dashboard).
    # Las IPs son fijas: se asignan en docker-compose.yml (red "backend").
    map $upstream_addr $upstream_name {
        default             "";
        "172.30.0.11:8081"  "game-1";
        "172.30.0.12:8081"  "game-2";
        "172.30.0.13:8081"  "game-3";
        "172.30.0.21:3000"  "api-1";
        "172.30.0.22:3000"  "api-2";
    }

    # Nivel del log según el código HTTP: 5xx = ERROR, 4xx = WARN
    map $status $log_level {
        ~^5     "ERROR";
        ~^4     "WARN";
        default "INFO";
    }

    # Necesario para el WebSocket: si el cliente pide "Upgrade", lo reenviamos
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------- Límite de peticiones por IP (protección básica anti abuso / DoS) ----------
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # ---------- Grupo de game-servers ----------
    # Algoritmo: HASH CONSISTENTE por código de sala (?room=ABCD).
    # Todos los jugadores de una sala tienen que llegar al MISMO servidor, porque la
    # partida vive en su memoria. Es nuestra versión de las "sticky sessions" del ALB.
    # "consistent" = si se cae o se añade un servidor, solo se mueven las salas de ese.
    upstream game_servers {
        hash $arg_room consistent;
        server game-1:8081 max_fails=3 fail_timeout=10s;
        server game-2:8081 max_fails=3 fail_timeout=10s;
        server game-3:8081 max_fails=3 fail_timeout=10s;
    }

    # ---------- Grupo de instancias de la API ----------
    # Algoritmo: LEAST CONNECTIONS (la instancia con menos peticiones en curso).
    # La API no guarda estado (todo está en PostgreSQL): cualquier instancia sirve.
    upstream api_servers {
        least_conn;
        server api-1:3000 max_fails=3 fail_timeout=10s;
        server api-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Cabeceras de seguridad
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Qué instancia respondió (para demostrar el balanceo con curl o el navegador)
        add_header X-Upstream $upstream_addr always;

        # Frontend estático (en AWS: S3 + CloudFront)
        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri $uri/ =404;
        }
        location ~* \.(js|png|ogg|mp3|wav)$ {
            expires 1h;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # WebSocket del juego → game-servers (hash por sala)
        location /ws/game {
            limit_conn ws_conn 10;  # máx. 10 conexiones simultáneas por IP
            proxy_pass http://game_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;  # las partidas duran minutos: no cortar el WebSocket
            proxy_send_timeout 3600s;
        }

        # Guardar partidas es SOLO para los game-servers (red interna de Docker).
        # Desde fuera solo se permite leer (GET). Defensa en profundidad: la API
        # además exige un token secreto.
        location = /api/matches {
            limit_except GET {
                deny all;
            }
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API REST → instancias de Node (least_conn)
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check del propio balanceador
        location = /nginx-health {
            access_log off;
            return 200 "OK\n";
        }
    }
}
