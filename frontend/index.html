<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bomberman LAN</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
    #game { width: 100%; height: 100%; }

    /* Formulario del menú (Phaser lo coloca encima del canvas con "this.add.dom") */
    .menu-form { display: flex; flex-direction: column; gap: 12px; width: 320px;
                 font-family: "Trebuchet MS", Verdana, sans-serif; }
    .menu-form input { font-size: 20px; padding: 10px 12px; border-radius: 8px; border: 3px solid #1f2937;
                       background: #f8fafc; color: #0f172a; outline: none; text-align: center; }
    .menu-form input:focus { border-color: #f59e0b; }
    .menu-form button { font-size: 20px; font-weight: bold; padding: 10px; border-radius: 8px; cursor: pointer;
                        border: 3px solid #1f2937; background: #f59e0b; color: #1f2937; }
    .menu-form button:hover { background: #fbbf24; }
    .menu-form button.secondary { background: #38bdf8; }
    .menu-form button.secondary:hover { background: #7dd3fc; }
    .menu-form .row { display: flex; gap: 8px; }
    .menu-form .row input { flex: 1; min-width: 0; text-transform: uppercase; }
    .menu-form .sep { text-align: center; color: #94a3b8; font-size: 14px; }
    .menu-form .msg { min-height: 20px; text-align: center; color: #fca5a5; font-size: 15px; margin: 0; }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 (licencia MIT), copiado en local para que funcione sin internet -->
  <script src="lib/phaser.min.js"></script>
  <!-- Nuestro código usa módulos ES (import/export) -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
